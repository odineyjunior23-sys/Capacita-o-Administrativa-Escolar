<title>Administrador — Diagnóstico de Capacitação</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--navy:#083f8e;--blue:#1b63c4;--gold:#fdc300;--bg:#f2f6fa;--ink:#1b2733;--mute:#5d6d7e;--line:#d5dfe9;--ok:#1e8e5a;--err:#c62f3a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{background:var(--navy);color:#fff;border-bottom:5px solid;border-image:linear-gradient(90deg,#ffc400,#17a24a) 1}
.hd{max-width:980px;margin:auto;padding:.7rem 1.2rem;display:flex;align-items:center;gap:1.1rem}.hd img{height:88px;width:auto;display:block;flex:none}.hd .tt{flex:1}.hd .chip{flex:none}
.hd h1{font-size:1.15rem;margin:0;line-height:1.3}.hd small{opacity:.8;display:block;font-weight:400}
main{max-width:980px;margin:1.2rem auto 3rem;padding:0 1rem}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1.2rem 1.4rem;margin-bottom:1rem}
.card h2{margin:0 0 .6rem;font-size:1.1rem;color:var(--navy);border-left:5px solid var(--gold);padding-left:.6rem}
.card h3{margin:1.2rem 0 .5rem;font-size:1rem;color:var(--blue)}
.q{font-weight:600;margin:1rem 0 .3rem}
.hint{color:var(--mute);font-size:.9rem;margin:0 0 .6rem}
input[type=text],input[type=password],input[type=search],textarea{width:100%;padding:.65rem .8rem;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
input:focus,textarea:focus,button:focus-visible,select:focus{outline:3px solid #9cc7ec;border-color:var(--blue)}
textarea{min-height:90px;resize:vertical}
.opt{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .8rem;border:1px solid var(--line);border-radius:8px;margin:.35rem 0;cursor:pointer}
.opt:has(input:checked){border-color:var(--blue);background:#eaf3fb}
.opt input{margin-top:.3rem;accent-color:var(--blue)}
.row2{display:flex;gap:.6rem;flex-wrap:wrap}.row2 .opt{flex:1;min-width:160px}
.btn{border:0;border-radius:8px;padding:.7rem 1.3rem;font:inherit;font-weight:600;cursor:pointer;background:var(--blue);color:#fff}
.btn:hover{background:var(--navy)}.btn.gold{background:var(--gold);color:#2a1d00}.btn.gold:hover{background:#cf9112}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.ghost:hover{background:#eaf3fb}
.btn.red{background:var(--err)}.btn.sm{padding:.4rem .8rem;font-size:.9rem}
.gt{width:100%;border-collapse:collapse;margin-top:.4rem}
.gt th{background:var(--navy);color:#fff;font-size:.82rem;padding:.55rem;text-align:center}.gt th:first-child{text-align:left}
.gt td{border-bottom:1px solid var(--line);padding:.55rem;vertical-align:middle}
.gt td.c{text-align:center;width:17%}.gt td.c label{display:block;cursor:pointer;padding:.3rem}
.gt td.c input{accent-color:var(--blue);width:18px;height:18px}
.gt .d{display:block;font-size:.85rem;color:var(--mute);font-weight:400}
.lv{display:none}
.gt tr.bad td:first-child{border-left:4px solid var(--err);background:#fdecee}
.err{color:var(--err);font-weight:600}.card.bad{border-color:var(--err)}
.chip{background:rgba(255,255,255,.18);padding:.25rem .7rem;border-radius:20px;font-size:.9rem}
.ok{text-align:center;padding:2rem 1rem}.ok b{font-size:3rem;color:var(--ok)}
table.adm{width:100%;border-collapse:collapse;background:#fff}
table.adm th{background:var(--navy);color:#fff;text-align:left;padding:.6rem;font-size:.85rem}
table.adm td{padding:.6rem;border-bottom:1px solid var(--line)}
table.adm tbody tr{cursor:pointer}table.adm tbody tr:hover{background:#eaf3fb}
.tag{background:#fdecee;color:var(--err);border-radius:12px;padding:.1rem .6rem;font-weight:600;font-size:.85rem}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}.bar input{flex:1;min-width:200px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.modal{position:fixed;inset:0;background:rgba(10,25,40,.55);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:9}
.modal[hidden]{display:none}.box{background:#fff;border-radius:12px;max-width:460px;width:100%;padding:1.3rem;border-top:5px solid var(--gold)}
.box h3{margin:0 0 .3rem;color:var(--navy)}.fmt{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:1rem 0}
.fmt .btn{padding:.9rem .4rem}
.warn{background:#fff6dd;border:1px solid var(--gold);padding:.6rem .9rem;border-radius:8px;font-size:.9rem;margin-bottom:.8rem}
.lk{color:var(--blue);cursor:pointer;font-size:.9rem;text-decoration:underline}.okm{color:var(--ok);font-weight:600}
.pw{position:relative}.pw input{padding-right:2.8rem}.eye{position:absolute;right:.3rem;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mute);cursor:pointer;padding:.4rem;display:flex}.eye:hover{color:var(--navy)}
footer{text-align:center;color:var(--mute);font-size:.85rem;margin-top:1.5rem}footer a{color:var(--blue);cursor:pointer}
@media(max-width:700px){
.gt thead{display:none}.gt tr{display:block;padding:.6rem 0;border-bottom:1px solid var(--line)}
.gt td{display:block;border:0;padding:.2rem 0}.gt td.c{text-align:left;width:auto}.gt td.c label{display:flex;gap:.5rem;align-items:center}
.lv{display:inline}.hd img{height:64px}.hd h1{font-size:1rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

async function admPanel(){
 $('#app').innerHTML=`${remote()?'':'<div class="warn"><b>Atenção:</b> o Supabase não está configurado. Os cadastros estão sendo guardados apenas neste navegador.</div>'}
 <div class="card"><h2>Cadastros recebidos <span id="cnt" class="chip" style="background:var(--navy);color:#fff"></span></h2>
 <p class="hint">Clique em um cadastro da grade para baixá-lo em Word, Excel ou PDF.</p>
 <div class="bar"><input type="search" id="q" placeholder="Buscar por nome, unidade ou cargo"><button class="btn gold sm" id="all">Exportar todos</button><button class="btn ghost sm" id="cc">Alterar código</button><button class="btn ghost sm" id="out">Sair</button></div>
 <div class="wrap"><table class="adm"><thead><tr><th>Nº</th><th>Data</th><th>Nome</th><th>Unidade</th><th>Cargo</th><th>Muita dificuldade</th></tr></thead><tbody id="tb"><tr><td colspan="6">Carregando…</td></tr></tbody></table></div></div>`;
 $('#cc').onclick=admChange;$('#out').onclick=()=>{admin=false;route()};
 $('#q').oninput=draw;$('#all').onclick=()=>cache.length?openExp(cache,'Todos os cadastros ('+cache.length+')'):0;
 try{cache=await dbList();draw()}catch(e){$('#tb').innerHTML=`<tr><td colspan="6" class="err">Erro ao carregar: ${esc(e.message)}</td></tr>`}
}
const nG=r=>Object.values(r.dados.grade||{}).filter(v=>v==='g').length;
const cargoTxt=d=>d.cargo+(d.cargoOutro?': '+d.cargoOutro:'');
function draw(){
 const q=$('#q').value.toLowerCase(),L=cache.map((r,i)=>({r,n:cache.length-i})).filter(({r})=>(r.dados.nome+r.dados.unidade+cargoTxt(r.dados)).toLowerCase().includes(q));
 $('#cnt').textContent=cache.length;
 $('#tb').innerHTML=L.length?L.map(({r,n})=>`<tr data-id="${r.id}"><td>${n}</td><td>${fd(r.created_at)}</td><td><b>${esc(r.dados.nome)}</b></td><td>${esc(r.dados.unidade)}</td><td>${esc(cargoTxt(r.dados))}</td><td><span class="tag">${nG(r)} de 14</span></td></tr>`).join(''):'<tr><td colspan="6">Nenhum cadastro encontrado.</td></tr>';
 $$('#tb tr[data-id]').forEach(tr=>tr.onclick=()=>{const r=cache.find(x=>x.id==tr.dataset.id);openExp([r],r.dados.nome,true)});
}
function openExp(L,title,one){
 const m=$('#md');m.hidden=false;
 m.innerHTML=`<div class="box"><h3>${esc(title)}</h3><p class="hint">${one?esc(L[0].dados.unidade)+' · '+esc(cargoTxt(L[0].dados))+' · '+fd(L[0].created_at):'Um único arquivo com todos os cadastros.'}</p><p class="q" style="margin:0">Escolha o formato:</p>
 <div class="fmt"><button class="btn" data-f="doc">Word</button><button class="btn" data-f="xls">Excel</button><button class="btn" data-f="pdf">PDF</button></div>
 <div style="display:flex;justify-content:space-between;gap:.5rem">${one?'<button class="btn red sm" id="del">Excluir</button>':'<span></span>'}<button class="btn ghost sm" id="cl">Fechar</button></div></div>`;
 $('#cl').onclick=()=>m.hidden=true;m.onclick=e=>{if(e.target===m)m.hidden=true};
 const base=one?'diagnostico_'+L[0].dados.nome.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\W+/g,'_').toLowerCase():'diagnostico_todos_os_cadastros';
 $$('.fmt .btn').forEach(b=>b.onclick=()=>({doc:toWord,xls:toExcel,pdf:toPdf})[b.dataset.f](L,base));
 if(one)$('#del').onclick=async()=>{if(confirm('Excluir o cadastro de '+L[0].dados.nome+'? Esta ação não pode ser desfeita.')){try{await dbDel(L[0].id);m.hidden=true;cache=cache.filter(x=>x.id!=L[0].id);draw()}catch(e){alert('Erro ao excluir: '+e.message)}}};
}
/* ====== EXPORTAÇÃO ====== */
function secs(r){const d=r.dados;return[
{t:'Identificação',h:['Campo','Resposta'],b:[['Nome',d.nome],['Data do preenchimento',fd(r.created_at)],['Tipo de unidade',d.unidade],['Cargo / função',cargoTxt(d)]]},
...GR.map(g=>({t:g.t,h:['Tema','Grau de dificuldade'],b:g.i.map(i=>[i[1]+(i[2]?' '+i[2]:''),LV[d.grade[i[0]]]||'—'])})),
{t:'Bloco 3 – Desafios e Sugestões',h:['Pergunta','Resposta'],b:[[QA[0],d.tarefa||'—'],[QA[1],d.sistema||'—'],[QA[2],(d.formatos||[]).join('; ')||'—'],[QA[3],(d.periodos||[]).join('; ')||'—'],[QA[4],d.descricao||'—']]}]}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const TIT='Diagnóstico de Necessidades de Capacitação Administrativa Escolar';
function toWord(L,base){
 const body=L.map((r,k)=>`<div${k?' style="page-break-before:always"':''}><h1>${TIT}</h1><p style="color:#5d6d7e">Secretaria Municipal de Educação de Maracaju · Departamento de Planejamento e Prestação de Contas</p>${secs(r).map(s=>`<h2>${esc(s.t)}</h2><table><tr>${s.h.map(h=>`<th>${h}</th>`).join('')}</tr>${s.b.map(x=>`<tr><td width="55%">${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join('')}</table>`).join('')}</div>`).join('');
 const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${TIT}</title><style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt}h1{color:#083f8e;font-size:16pt}h2{color:#1b63c4;font-size:13pt;margin-top:14pt}table{border-collapse:collapse;width:100%}th{background:#083f8e;color:#fff;text-align:left;padding:4pt;border:1px solid #083f8e}td{border:1px solid #9fb3c8;padding:4pt;vertical-align:top}</style></head><body>${body}</body></html>`;
 save(new Blob(['\ufeff'+html],{type:'application/msword'}),base+'.doc');
}
function toExcel(L,base){
 const wb=XLSX.utils.book_new();let ws;
 if(L.length===1){const a=[];secs(L[0]).forEach(s=>{a.push([s.t]);a.push(s.h);s.b.forEach(x=>a.push(x));a.push([])});ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=[{wch:80},{wch:55}]}
 else{const it=GR.flatMap(g=>g.i);const a=[['Nº','Data','Nome','Unidade','Cargo / função',...it.map(i=>i[1]),'Tarefa que mais toma tempo','Sistema com necessidade de suporte','Formato preferido','Período preferencial','Descrição livre']];
  L.forEach((r,k)=>{const d=r.dados;a.push([L.length-k,fd(r.created_at),d.nome,d.unidade,cargoTxt(d),...it.map(i=>LV[d.grade[i[0]]]||''),d.tarefa,d.sistema,(d.formatos||[]).join('; '),(d.periodos||[]).join('; '),d.descricao])});
  ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=a[0].map(()=>({wch:24}))}
 XLSX.utils.book_append_sheet(wb,ws,'Cadastros');XLSX.writeFile(wb,base+'.xlsx');
}
function toPdf(L,base){
 const doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
 L.forEach((r,k)=>{if(k)doc.addPage();doc.setFont('helvetica','bold').setFontSize(14).setTextColor(8,63,142);doc.text(TIT,40,48,{maxWidth:515});
  doc.setFont('helvetica','normal').setFontSize(9).setTextColor(93,109,126);doc.text('Secretaria Municipal de Educação de Maracaju · Departamento de Planejamento e Prestação de Contas',40,82,{maxWidth:515});
  let y=100;
  secs(r).forEach(s=>{if(y>740){doc.addPage();y=50}doc.setFont('helvetica','bold').setFontSize(11).setTextColor(27,99,196);doc.text(s.t,40,y,{maxWidth:515});
   doc.autoTable({startY:y+6,head:[s.h],body:s.b,theme:'grid',styles:{fontSize:8.5,cellPadding:4,textColor:[27,39,51]},headStyles:{fillColor:[8,63,142]},columnStyles:{0:{cellWidth:290}},margin:{left:40,right:40}});y=doc.lastAutoTable.finalY+16});
 });
 doc.save(base+'.pdf');
}
/* ====== ROTAS ====== */
function route(){$('#md').hidden=true;admin?admPanel():admLogin()}
route();
</script>
</body>
</html>
